name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# One in-flight run per ref. Cancel superseded runs on PR branches only — never on
# `main`, where every commit must be independently verified (bisectability), so a
# rapid second push cannot cancel the first commit's run before it reports.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test (workspace)
        run: cargo test --locked --workspace --all-features

      - name: Engine + bridge + VM compile to wasm32 (browser / Facet target)
        run: cargo build --locked -p glyph-atlas -p tessera-ascii -p mosaic-vm -p mosaic-wasm --target wasm32-unknown-unknown

      - name: Facets — fmt, clippy, and committed .wasm matches source
        run: |
          for f in ramp dither structural interp liar spin; do
            cargo fmt --manifest-path "facets/$f/Cargo.toml" -- --check
            # No --all-targets: it pulls in the test harness, whose std panic handler
            # collides with each no_std Facet's #[panic_handler]. Lint the guest lib.
            cargo clippy --locked --manifest-path "facets/$f/Cargo.toml" \
              --target wasm32-unknown-unknown -- -D warnings
          done
          bash scripts/build-facets.sh
          if ! git diff --exit-code -- '*.wasm'; then
            echo "::error::A committed Facet .wasm does not match facets/*/src. Run scripts/build-facets.sh and commit the result." >&2
            exit 1
          fi

      - name: Golden vectors are fresh
        run: bash scripts/verify-fixtures.sh

      # The production artifact must compile in release, not only in the debug test build.
      # The deployable container (see Dockerfile) is built by CD; this gate proves the
      # release binary at every commit without paying for a full image build in CI.
      - name: Release build (mosaic-server production binary)
        run: cargo build --release --locked -p mosaic-server

  web:
    name: Web — facet-abi + mosaic-wasm (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm32)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build mosaic-wasm (nodejs target)
        run: wasm-pack build crates/mosaic-wasm --target nodejs --dev --out-dir pkg

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm and install JS dev dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Type-check TypeScript (strict, no emit)
        run: pnpm run typecheck

      - name: Test (facet-abi + mosaic-wasm pipeline)
        run: >
          node --test
          packages/facet-abi/test/conformance.test.ts
          packages/facet-abi/test/adversarial.test.ts
          packages/facet-abi/test/conformance-gate.test.ts
          packages/facet-abi/test/timeout.test.ts
          packages/facet-abi/test/dsl.test.ts
          packages/facet-abi/test/cert.test.ts
          packages/facet-abi/test/program.test.ts
          packages/facet-abi/test/program_cert.test.ts
          crates/mosaic-wasm/test/pipeline.test.ts
          crates/mosaic-wasm/test/spectral.test.ts
          crates/mosaic-wasm/test/composite.test.ts
          crates/mosaic-wasm/test/authoring.test.ts
          crates/mosaic-wasm/test/color.test.ts

  audit:
    name: Security — cargo audit (RUSTSEC advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the pinned toolchain from rust-toolchain.toml.
      - name: Install Rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-audit

      - name: Audit dependencies for known advisories
        run: cargo audit
