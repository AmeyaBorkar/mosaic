[package]
name = "mosaic-certify"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Mosaic's authoritative conformance gate: admit a Facet only if it fits the profile, and certify it with golden (features -> tokens) vectors from the proven native host."
publish = false

[dependencies]
# The authoritative host: certify compiles and runs each Facet here to produce its golden
# probe results. Also the source of the sandbox limits the profile mirrors by value.
mosaic-runtime = { path = "../mosaic-runtime" }
# The DSL bytecode VM: certifying a *program* validates it natively (for a precise rejection
# code and its declared stride) before running it through the shipped interpreter Facet.
mosaic-vm = { path = "../mosaic-vm" }
# Typed structural inspection of untrusted module bytes (imports, memory/table limits,
# exports, function bodies) for the static profile gate. Pinned to the version wasmtime 47
# already uses (via mosaic-runtime), so no extra crate enters the graph.
wasmparser = "0.254"
# The certificate and rejection are serialized by the server (JSON) and the golden emitter.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content-hash a Facet's exact bytes, binding a certificate to the module it attests.
sha2 = "0.10"

[dev-dependencies]
# Assemble binary wasm from WAT in the profile-fixture and certify tests.
wat = "1"
# Compile DSL source to bytecode in the program-certification tests (the same compiler the
# browser and server use), so the tests certify a real authored program.
mosaic-dsl = { path = "../mosaic-dsl" }
