[package]
name = "mosaic-registry"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Mosaic's Facet registry: store, list, fetch, and moderate certified Facets behind a Store trait."
publish = false

[dependencies]
# The certificate and ABI kind stored with each Facet.
mosaic-certify = { path = "../mosaic-certify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The durable backend: a pure-Rust, embedded, ACID key-value store. No C toolchain and no
# server process, so it compiles on every target and needs no infrastructure — the robust,
# self-contained choice for a registry that must survive restarts.
redb = "4.1.0"

[dev-dependencies]
# Isolated temp directories for the durable-store tests.
tempfile = "3"
